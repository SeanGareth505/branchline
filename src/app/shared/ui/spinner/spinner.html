<span class="spinner" [attr.data-size]="size()" role="status" [attr.aria-label]="label()">
  <svg viewBox="0 0 32 32" fill="none" aria-hidden="true">
    <defs>
      <filter [attr.id]="glowId" x="-50%" y="-50%" width="200%" height="200%">
        <feGaussianBlur stdDeviation="1.2" result="blur" />
        <feMerge>
          <feMergeNode in="blur" />
          <feMergeNode in="SourceGraphic" />
        </feMerge>
      </filter>
    </defs>

    <circle class="halo" cx="16" cy="16" r="13.4" />

    <path class="track" d="M11.5 7.5v7.2c0 1.7 1.2 2.8 2.8 2.8H21" />
    <path class="track" d="M11.5 14.7V24.5" />

    <path
      class="flow flow-a"
      [attr.filter]="'url(#' + glowId + ')'"
      d="M11.5 7.5v7.2c0 1.7 1.2 2.8 2.8 2.8H21"
    />
    <path
      class="flow flow-b"
      [attr.filter]="'url(#' + glowId + ')'"
      d="M11.5 14.7V24.5"
    />

    <circle
      class="node n1"
      cx="11.5"
      cy="7.5"
      r="2.35"
      [attr.filter]="'url(#' + glowId + ')'"
    />
    <circle
      class="node n2"
      cx="21"
      cy="17.5"
      r="2.35"
      [attr.filter]="'url(#' + glowId + ')'"
    />
    <circle
      class="node n3"
      cx="11.5"
      cy="24.5"
      r="2.35"
      [attr.filter]="'url(#' + glowId + ')'"
    />

    <circle class="comet" r="1.55" [attr.filter]="'url(#' + glowId + ')'">
      <animateMotion
        dur="1.5s"
        repeatCount="indefinite"
        path="M11.5 7.5v7.2c0 1.7 1.2 2.8 2.8 2.8H21"
      />
    </circle>
    <circle class="comet comet-b" r="1.15" [attr.filter]="'url(#' + glowId + ')'">
      <animateMotion dur="1.5s" begin="0.42s" repeatCount="indefinite" path="M11.5 14.7V24.5" />
    </circle>
  </svg>
</span>
