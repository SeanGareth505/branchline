<span class="spinner" [attr.data-size]="size()" role="status" [attr.aria-label]="label()">
  @if (size() === 'lg') {
    <span class="glow" aria-hidden="true"></span>
  }
  <svg viewBox="0 0 48 48" aria-hidden="true">
    <circle class="track" cx="24" cy="24" r="20" />
    <g class="rotor">
      <circle class="arc" cx="24" cy="24" r="20" pathLength="100" />
      @if (size() === 'lg') {
        <circle class="node" cx="20.18" cy="43.63" r="3.4" />
      }
    </g>
  </svg>
</span>
