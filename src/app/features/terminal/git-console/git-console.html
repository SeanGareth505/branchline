<div class="console mono">
  <header>
    <span class="bl-heading-row">
      <span>Git console · {{ store.currentRepo()?.name ?? 'no repo' }}</span>
      <app-help-tip
        compact
        heading="Git console"
        body="Run raw git commands in this repository. Quick buttons cover status, log, diff, and branch. Output stays in this panel."
      />
    </span>
    <div class="quick">
      <button
        type="button"
        class="bl-btn"
        [disabled]="running()"
        (click)="runQuick('status -sb')"
        title="Run git status -sb"
      >
        status
      </button>
      <button
        type="button"
        class="bl-btn"
        [disabled]="running()"
        (click)="runQuick('log --oneline -12')"
        title="Run git log --oneline -12"
      >
        log
      </button>
      <button
        type="button"
        class="bl-btn"
        [disabled]="running()"
        (click)="runQuick('diff --stat')"
        title="Run git diff --stat"
      >
        diff
      </button>
      <button
        type="button"
        class="bl-btn"
        [disabled]="running()"
        (click)="runQuick('branch -vv')"
        title="Run git branch -vv"
      >
        branch
      </button>
      <button type="button" class="bl-btn" (click)="clear()" title="Clear console output">
        Clear
      </button>
    </div>
  </header>
  <pre>
@for (line of lines(); track $index) {
<span>{{ line }}</span>
}
  </pre>
  <form class="input-row" ngNoForm (submit)="$event.preventDefault(); run()">
    <span class="prompt">$</span>
    <span class="git">git</span>
    <input
      name="command"
      [ngModel]="command()"
      [ngModelOptions]="{ standalone: true }"
      (ngModelChange)="command.set($event)"
      (keydown.enter)="$event.preventDefault(); run()"
      placeholder="status -sb"
      [disabled]="running()"
      autocomplete="off"
      spellcheck="false"
    />
    <button type="submit" class="bl-btn bl-btn-primary" [disabled]="running()">Run</button>
  </form>
</div>
