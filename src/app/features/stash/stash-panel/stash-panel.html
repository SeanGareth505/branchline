<section class="group kind-stash" [class.collapsed]="!open()">
  <div class="group-head-row">
    <button
      type="button"
      class="group-head"
      (click)="toggle($event)"
      [attr.aria-expanded]="open()"
    >
      <ng-icon class="chev" [name]="chevron()" size="13" />
      <span class="kind" title="Temporarily shelved uncommitted changes">Stash</span>
      <span class="count">{{ filtered().length }}</span>
    </button>
    <app-help-tip
      compact
      heading="Stash"
      body="Temporarily shelves uncommitted changes so you can switch branches with a clean working tree. Apply brings them back; drop deletes them for good."
    />
    @if (store.stashes().length > 0) {
      <button
        type="button"
        class="group-action danger"
        title="Permanently delete every stash"
        (click)="dropAll($event)"
      >
        Drop all
      </button>
    }
    <button
      type="button"
      class="icon always"
      (click)="startStash($event)"
      aria-label="Stash working tree changes"
      title="Stash working tree changes"
    >
      <ng-icon name="lucidePlus" size="11" />
    </button>
    <button
      type="button"
      class="icon"
      (click)="requestHide($event)"
      aria-label="Hide Stash"
      title="Hide this section"
    >
      <ng-icon name="lucideEyeOff" size="11" />
    </button>
  </div>

  @if (open()) {
    @if (drafting()) {
      <div class="create">
        <input
          [ngModel]="message()"
          (ngModelChange)="message.set($event)"
          placeholder="Optional message"
          (keydown.enter)="push()"
        />
        <label class="check" title="Also stash files Git is not tracking yet">
          <input
            type="checkbox"
            [ngModel]="includeUntracked()"
            (ngModelChange)="includeUntracked.set($event)"
          />
          Include untracked
        </label>
        <div class="row">
          <button type="button" class="bl-btn bl-btn-primary" (click)="push()">Stash</button>
          <button type="button" class="bl-btn" (click)="drafting.set(false)">Cancel</button>
        </div>
      </div>
    }

    <ul class="card-list">
      @for (s of filtered(); track s.id) {
        <li>
          <div class="meta">
            <button
              type="button"
              class="title-row"
              [disabled]="!s.sha"
              [title]="s.sha ? 'Show this stash commit' : s.id"
              (click)="showStash(s)"
            >
              <ng-icon name="lucideArchive" size="12" />
              <span class="mono">{{ s.id }}</span>
            </button>
            <span class="msg" [title]="s.message">{{ s.message }}</span>
          </div>
          <div class="actions">
            <button
              type="button"
              class="link"
              (click)="store.stashApply(s.index)"
              title="Apply stash without removing it"
            >
              Apply
            </button>
            <button
              type="button"
              class="link"
              (click)="store.stashPop(s.index)"
              title="Apply stash and remove it from the list"
            >
              Pop
            </button>
            <button
              type="button"
              class="link"
              (click)="store.stashBranch(s.index)"
              title="Create a branch from this stash, apply it, and drop it"
            >
              Branch
            </button>
            <button
              type="button"
              class="link danger"
              (click)="store.stashDrop(s.index)"
              title="Delete this stash"
            >
              Drop
            </button>
          </div>
        </li>
      } @empty {
        <li class="empty-row">No stashes</li>
      }
    </ul>
  }
</section>
