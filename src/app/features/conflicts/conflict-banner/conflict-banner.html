<div class="banner" [class.ready]="readyToContinue()">
  <div class="info">
    <span class="status-icon" aria-hidden="true">
      <ng-icon [name]="readyToContinue() ? 'lucideCheck' : 'lucideGitMerge'" size="17" />
    </span>
    <div class="copy">
      <div class="title-row">
        <span class="eyebrow">{{ readyToContinue() ? 'Ready to continue' : 'Merge session' }}</span>
        <strong>{{ title() }}</strong>
      </div>
      <p class="hint" id="conflict-banner-hint">{{ hint() }}</p>
      <div
        class="session-progress"
        role="progressbar"
        aria-label="Conflict resolution progress"
        aria-valuemin="0"
        aria-valuemax="100"
        [attr.aria-valuenow]="progressPercent()"
        [attr.aria-valuetext]="progressValueText()"
      >
        <span [style.width.%]="progressPercent()"></span>
      </div>
      @if (previewFiles().length) {
        <div class="files">
          @for (f of previewFiles(); track f.path) {
            <button
              type="button"
              class="file"
              [class.ready]="f.markersCleared"
              (click)="store.openConflictResolver(f.path)"
              [title]="f.path"
              [attr.aria-label]="fileChipLabel(f)"
            >
              <span class="file-state" aria-hidden="true">
                <ng-icon [name]="f.markersCleared ? 'lucideCheck' : 'lucideCircleAlert'" size="11" />
              </span>
              <span class="mono">{{ fileName(f.path) }}</span>
              @if (f.markersCleared) {
                <span class="kind ready">Ready</span>
              } @else if (f.conflictLabel) {
                <span class="kind">{{ f.conflictLabel }}</span>
              }
            </button>
          }
          @if (hiddenFileCount() > 0) {
            <button type="button" class="more-btn" (click)="openResolver()" title="Open resolver">
              +{{ hiddenFileCount() }} more
            </button>
          }
        </div>
      }
    </div>
  </div>
  <div class="actions">
    @if (conflictCount() > 0) {
      <button
        type="button"
        class="bl-btn bl-btn-primary"
        (click)="openResolver()"
        title="Resolve conflicts one file at a time"
      >
        <ng-icon name="lucideGitMerge" size="14" />
        Resolve conflicts
      </button>
      <div class="menu-wrap" (click)="$event.stopPropagation()">
        <button
          type="button"
          class="bl-btn"
          (click)="toggleTools()"
          aria-haspopup="menu"
          [attr.aria-expanded]="toolsOpen()"
          title="Open conflicts in an editor or merge tool"
        >
          Open in
          <ng-icon name="lucideChevronDown" size="12" />
        </button>
        @if (toolsOpen()) {
          <div class="menu" role="menu">
            <button type="button" role="menuitem" (click)="openInEditor()">
              Preferred ({{ preferredLabel() }})
            </button>
            <button type="button" role="menuitem" (click)="openCursor()">
              Cursor
              @if (!hasCursor()) {
                <span class="opt-hint">try anyway</span>
              }
            </button>
            <button type="button" role="menuitem" (click)="openCursorMerge()">
              Cursor 3-way merge
            </button>
            <button type="button" role="menuitem" (click)="openVscode()">
              VS Code
              @if (!hasVscode()) {
                <span class="opt-hint">try anyway</span>
              }
            </button>
            <button type="button" role="menuitem" (click)="openVscodeMerge()">
              VS Code 3-way merge
            </button>
            <button type="button" role="menuitem" (click)="openMergeTool()">Git mergetool</button>
          </div>
        }
      </div>
    }
    @if (operation()) {
      <button
        type="button"
        class="bl-btn"
        [class.bl-btn-primary]="readyToContinue()"
        [disabled]="!readyToContinue()"
        (click)="continueOp()"
        [title]="'Continue ' + (operation()?.label ?? 'operation')"
        [attr.aria-describedby]="readyToContinue() ? null : 'conflict-banner-hint'"
      >
        Continue
      </button>
      <button
        type="button"
        class="bl-btn abort"
        (click)="abortOp()"
        [title]="'Abort ' + (operation()?.label ?? 'operation') + ' — cannot be undone'"
      >
        Abort
      </button>
    }
  </div>
</div>
