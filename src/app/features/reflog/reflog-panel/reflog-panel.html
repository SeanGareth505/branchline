<div class="reflog">
  <header class="bl-heading-row">
    <span>Reflog · HEAD movements</span>
    <app-help-tip
      compact
      heading="Reflog"
      body="A diary of where HEAD has been — checkouts, commits, resets, amends. Use it to find a commit you thought was lost, then branch from it."
    />
  </header>
  @if (loading()) {
    <app-loading-block message="Loading reflog…" [compact]="true" />
  } @else {
    @if (store.danglingCommits().length) {
      <div class="lost">
        <p class="lost-head">Lost commits</p>
        <ul class="lost-list">
          @for (entry of store.danglingCommits(); track entry.sha) {
            <li>
              <button type="button" class="row lost-row" (click)="selectDangling(entry)">
                <span class="sha mono">{{ entry.shortSha }}</span>
                <span class="subject">{{ entry.subject }}</span>
                <span class="meta">{{ time(entry.timestamp) }}</span>
              </button>
              <button type="button" class="link" (click)="recover(entry)">Branch here</button>
            </li>
          }
        </ul>
      </div>
    }
    <ul class="entries">
      @for (entry of entries(); track entry.selector + entry.sha) {
        <li>
          <button type="button" class="row" (click)="select(entry)">
            <span class="sel mono">{{ entry.selector }}</span>
            <span class="sha mono">{{ entry.shortSha }}</span>
            <span class="action">{{ entry.action }}</span>
            <span class="subject">{{ entry.subject }}</span>
            <span class="meta">{{ time(entry.timestamp) }}</span>
          </button>
          <button type="button" class="link" (click)="checkout(entry)">Branch here</button>
        </li>
      } @empty {
        <li class="empty">No reflog entries</li>
      }
    </ul>
  }
</div>
