@if (visible()) {
  <button
    type="button"
    class="trigger"
    cdkOverlayOrigin
    #origin="cdkOverlayOrigin"
    [attr.aria-expanded]="menuOpen()"
    aria-haspopup="menu"
    aria-label="GitHub account"
    [title]="selectedLabel()"
    [disabled]="busy()"
    (click)="toggleMenu()"
  >
    <ng-icon name="lucideUser" size="13" />
    <span class="label">{{ selectedLabel() }}</span>
    @if (busy()) {
      <app-spinner size="sm" label="Switching account" class="chevron" />
    } @else {
      <ng-icon name="lucideChevronsUpDown" size="12" class="chevron" />
    }
  </button>

  <ng-template
    cdkConnectedOverlay
    [cdkConnectedOverlayOrigin]="origin"
    [cdkConnectedOverlayOpen]="menuOpen()"
    [cdkConnectedOverlayPositions]="menuPositions"
    [cdkConnectedOverlayPush]="true"
    [cdkConnectedOverlayWidth]="220"
    (overlayOutsideClick)="closeMenu()"
  >
    <div class="bl-menu" role="menu" aria-label="GitHub account">
      @for (account of accounts(); track account.key) {
        <button
          type="button"
          role="menuitemradio"
          [attr.aria-checked]="selectedKey() === account.key"
          [disabled]="busy()"
          (click)="choose(account.key)"
        >
          <span class="check">
            @if (selectedKey() === account.key) {
              <ng-icon name="lucideCheck" size="14" />
            }
          </span>
          {{ account.label }}
          @if (counts().get(account.key); as n) {
            <span class="shortcut">{{ n }}</span>
          }
        </button>
      }
      <button
        type="button"
        role="menuitemradio"
        [attr.aria-checked]="selectedKey() === allKey"
        [disabled]="busy()"
        (click)="choose(allKey)"
      >
        <span class="check">
          @if (selectedKey() === allKey) {
            <ng-icon name="lucideCheck" size="14" />
          }
        </span>
        All accounts
      </button>
      <div class="bl-menu-sep"></div>
      @if (canAdd()) {
        <button type="button" role="menuitem" [disabled]="busy()" (click)="addAccount()">
          Add account
        </button>
      }
      <button type="button" role="menuitem" (click)="manage()">Manage…</button>
    </div>
  </ng-template>
}
