name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  RELEASE_NOTES: |
    ## Download
    Easy download page: https://seangareth505.github.io/branchline/

    Public beta. Signed desktop builds when release secrets are configured.

    ### macOS
    1. Open the `.dmg` and drag Branchline to Applications
    2. Open it from Applications. Gatekeeper may ask you to confirm the first launch.
    3. If macOS says the app is damaged, use **Fix & Open** on the download page, or:
       `xattr -cr /Applications/Branchline.app && open /Applications/Branchline.app`

    ### Windows
    Run the setup `.exe`. SmartScreen may warn on early releases; choose More info → Run anyway if needed.

    ### Linux
    - **AppImage** — `Branchline-linux.AppImage` — run without installing
    - **Debian / Ubuntu** — `Branchline-linux.deb` — double-click or `sudo dpkg -i`

jobs:
  create-release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ github.ref_name }}"
          if gh release view "$TAG" -R "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release $TAG already exists"
            exit 0
          fi
          gh release create "$TAG" \
            -R "${{ github.repository }}" \
            --title "Branchline $TAG" \
            --notes "$RELEASE_NOTES"

  publish-tauri:
    name: ${{ matrix.name }}
    needs: [create-release]
    if: ${{ !cancelled() && (needs.create-release.result == 'success' || needs.create-release.result == 'skipped') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
            rust_target: aarch64-apple-darwin
            name: macOS arm64
          - platform: macos-latest
            args: --target x86_64-apple-darwin
            rust_target: x86_64-apple-darwin
            name: macOS Intel
          - platform: windows-latest
            args: ''
            rust_target: ''
            name: Windows
          - platform: ubuntu-22.04
            args: ''
            rust_target: ''
            name: Linux

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Import Apple Developer certificate
        if: matrix.platform == 'macos-latest'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "${APPLE_CERTIFICATE:-}" ]; then
            echo "No APPLE_CERTIFICATE secret; building unsigned macOS artifacts"
            exit 0
          fi
          KEYCHAIN_PASSWORD="${KEYCHAIN_PASSWORD:-branchline-ci-$(date +%s)}"
          echo "$APPLE_CERTIFICATE" | base64 --decode > certificate.p12
          if ! security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain; then
            echo "Failed to create keychain; building unsigned macOS artifacts"
            exit 0
          fi
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          if ! security import certificate.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security; then
            echo "Certificate import failed; building unsigned macOS artifacts"
            exit 0
          fi
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          security find-identity -v -p codesigning build.keychain
          CERT_ID=$(security find-identity -v -p codesigning build.keychain | awk -F'"' '/Developer ID Application/{print $2; exit}')
          if [ -z "$CERT_ID" ]; then
            CERT_ID=$(security find-identity -v -p codesigning build.keychain | awk -F'"' '/Apple Development|Apple Distribution/{print $2; exit}')
          fi
          if [ -z "$CERT_ID" ]; then
            echo "No signing identity found; building unsigned macOS artifacts"
            exit 0
          fi
          {
            echo "APPLE_SIGNING_IDENTITY=$CERT_ID"
            echo "APPLE_CERTIFICATE<<EOF"
            echo "$APPLE_CERTIFICATE"
            echo "EOF"
            echo "APPLE_CERTIFICATE_PASSWORD=$APPLE_CERTIFICATE_PASSWORD"
            if [ -n "${APPLE_ID:-}" ]; then echo "APPLE_ID=$APPLE_ID"; fi
            if [ -n "${APPLE_PASSWORD:-}" ]; then echo "APPLE_PASSWORD=$APPLE_PASSWORD"; fi
            if [ -n "${APPLE_TEAM_ID:-}" ]; then echo "APPLE_TEAM_ID=$APPLE_TEAM_ID"; fi
          } >> "$GITHUB_ENV"
          echo "Imported signing identity: $CERT_ID"

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || 'v__VERSION__' }}
          releaseName: Branchline ${{ github.ref_type == 'tag' && github.ref_name || 'v__VERSION__' }}
          releaseBody: ${{ env.RELEASE_NOTES }}
          releaseDraft: ${{ github.ref_type != 'tag' }}
          prerelease: false
          args: ${{ matrix.args }}

      - name: Verify updater artifacts uploaded
        if: startsWith(github.ref, 'refs/tags/v') && matrix.rust_target == 'aarch64-apple-darwin'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ github.ref_name }}"
          ASSETS=$(gh release view "$TAG" -R "${{ github.repository }}" --json assets --jq '.assets[].name')
          echo "$ASSETS"
          if ! echo "$ASSETS" | grep -qi '\.app\.tar\.gz$'; then
            echo "::error::macOS updater archive (.app.tar.gz) missing from $TAG — in-app updates will 404"
            exit 1
          fi
          if ! echo "$ASSETS" | grep -qi '\.dmg$'; then
            echo "::warning::No .dmg on $TAG — download page macOS links may be broken"
          fi

  stabilize-names:
    name: Stable download names
    needs: [publish-tauri]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Publish stable download filenames
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ github.ref_name }}"
          mkdir -p /tmp/rel
          gh release download "$TAG" -R "${{ github.repository }}" -D /tmp/rel

          copy_stable() {
            local pattern="$1"
            local stable="$2"
            local src
            src=$(find /tmp/rel -maxdepth 1 -type f -iname "$pattern" ! -name "$stable" | head -n 1 || true)
            if [ -z "$src" ]; then
              if [ -f "/tmp/rel/$stable" ]; then
                echo "Stable already: $stable"
              else
                echo "Skip missing pattern: $pattern"
              fi
              return 0
            fi
            cp "$src" "/tmp/rel/$stable"
            echo "Stable: $stable <- $(basename "$src")"
          }

          copy_stable '*aarch64*.dmg' 'Branchline-mac-arm64.dmg'
          copy_stable '*x64*.dmg' 'Branchline-mac-x64.dmg'
          copy_stable '*-setup.exe' 'Branchline-windows-setup.exe'
          copy_stable '*.AppImage' 'Branchline-linux.AppImage'
          copy_stable '*.deb' 'Branchline-linux.deb'

          REQUIRED=(
            Branchline-mac-arm64.dmg
            Branchline-mac-x64.dmg
            Branchline-windows-setup.exe
            Branchline-linux.AppImage
            Branchline-linux.deb
          )
          EXISTING=()
          missing=0
          for name in "${REQUIRED[@]}"; do
            f="/tmp/rel/$name"
            if [ -f "$f" ]; then
              EXISTING+=("$f")
            else
              echo "::error::Missing stable download name: $name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
          gh release upload "$TAG" "${EXISTING[@]}" -R "${{ github.repository }}" --clobber
