name: Release

on:
  workflow_dispatch:
    inputs:
      build_android:
        description: 'Build Android APK (slow; off by default)'
        type: boolean
        default: false
      skip_desktop:
        description: 'Skip desktop installers (use for an Android-only run)'
        type: boolean
        default: false
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  NDK_VERSION: '27.0.12077973'
  RELEASE_NOTES: |
    ## Download
    Easy download page: https://seangareth505.github.io/branchline/

    Public beta. Signed desktop builds when release secrets are configured.

    ### macOS
    1. Open the `.dmg` and drag Branchline to Applications
    2. Open it from Applications. Gatekeeper may ask you to confirm the first launch.
    3. If macOS says the app is damaged, use **Fix & Open** on the download page, or:
       `xattr -cr /Applications/Branchline.app && open /Applications/Branchline.app`

    ### Windows
    Run the setup `.exe`. SmartScreen may warn on early releases; choose More info → Run anyway if needed.

    ### Android
    Sideload preview only. Install `Branchline-android.apk` (enable install from this source if asked). Local Git on phone is limited.
    Install `Branchline-android.apk` (enable install from this source if asked).

jobs:
  create-release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ github.ref_name }}"
          if gh release view "$TAG" -R "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release $TAG already exists"
            exit 0
          fi
          gh release create "$TAG" \
            -R "${{ github.repository }}" \
            --title "Branchline $TAG" \
            --notes "$RELEASE_NOTES"

  publish-tauri:
    name: ${{ matrix.name }}
    needs: [create-release]
    if: ${{ !cancelled() && (needs.create-release.result == 'success' || needs.create-release.result == 'skipped') && github.event.inputs.skip_desktop != 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
            rust_target: aarch64-apple-darwin
            name: macOS arm64
          - platform: macos-latest
            args: --target x86_64-apple-darwin
            rust_target: x86_64-apple-darwin
            name: macOS Intel
          - platform: ubuntu-22.04
            args: ''
            rust_target: ''
            name: Linux
          - platform: windows-latest
            args: ''
            rust_target: ''
            name: Windows

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm ci

      - name: Import Apple Developer certificate
        if: matrix.platform == 'macos-latest'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "${APPLE_CERTIFICATE:-}" ]; then
            if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
              echo "::error::APPLE_CERTIFICATE is required for public macOS releases"
              exit 1
            fi
            echo "No APPLE_CERTIFICATE secret; building unsigned macOS artifacts"
            exit 0
          fi
          KEYCHAIN_PASSWORD="${KEYCHAIN_PASSWORD:-branchline-ci-$(date +%s)}"
          echo "$APPLE_CERTIFICATE" | base64 --decode > certificate.p12
          if ! security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain; then
            echo "Failed to create keychain; building unsigned macOS artifacts"
            exit 0
          fi
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          if ! security import certificate.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security; then
            echo "Certificate import failed; building unsigned macOS artifacts"
            exit 0
          fi
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          security find-identity -v -p codesigning build.keychain
          CERT_ID=$(security find-identity -v -p codesigning build.keychain | awk -F'"' '/Developer ID Application/{print $2; exit}')
          if [ -z "$CERT_ID" ]; then
            CERT_ID=$(security find-identity -v -p codesigning build.keychain | awk -F'"' '/Apple Development|Apple Distribution/{print $2; exit}')
          fi
          if [ -z "$CERT_ID" ]; then
            echo "No signing identity found; building unsigned macOS artifacts"
            exit 0
          fi
          {
            echo "APPLE_SIGNING_IDENTITY=$CERT_ID"
            echo "APPLE_CERTIFICATE<<EOF"
            echo "$APPLE_CERTIFICATE"
            echo "EOF"
            echo "APPLE_CERTIFICATE_PASSWORD=$APPLE_CERTIFICATE_PASSWORD"
            if [ -n "${APPLE_ID:-}" ]; then echo "APPLE_ID=$APPLE_ID"; fi
            if [ -n "${APPLE_PASSWORD:-}" ]; then echo "APPLE_PASSWORD=$APPLE_PASSWORD"; fi
            if [ -n "${APPLE_TEAM_ID:-}" ]; then echo "APPLE_TEAM_ID=$APPLE_TEAM_ID"; fi
          } >> "$GITHUB_ENV"
          echo "Imported signing identity: $CERT_ID"

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || 'v__VERSION__' }}
          releaseName: Branchline ${{ github.ref_type == 'tag' && github.ref_name || 'v__VERSION__' }}
          releaseBody: ${{ env.RELEASE_NOTES }}
          releaseDraft: ${{ github.ref_type != 'tag' }}
          prerelease: false
          args: ${{ matrix.args }}

      - name: Verify updater artifacts uploaded
        if: startsWith(github.ref, 'refs/tags/v') && matrix.rust_target == 'aarch64-apple-darwin'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ github.ref_name }}"
          ASSETS=$(gh release view "$TAG" -R "${{ github.repository }}" --json assets --jq '.assets[].name')
          echo "$ASSETS"
          if ! echo "$ASSETS" | grep -qi '\.app\.tar\.gz$'; then
            echo "::error::macOS updater archive (.app.tar.gz) missing from $TAG — in-app updates will 404"
            exit 1
          fi
          if ! echo "$ASSETS" | grep -qi '\.dmg$'; then
            echo "::warning::No .dmg on $TAG — download page macOS links may be broken"
          fi

  build-apk:
    name: Android
    needs: [create-release]
    if: ${{ !cancelled() && (needs.create-release.result == 'success' || needs.create-release.result == 'skipped') && github.event.inputs.build_android == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read app version
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Android NDK and platforms
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.ANDROID_HOME }}/ndk
            ${{ env.ANDROID_HOME }}/platforms
            ${{ env.ANDROID_HOME }}/build-tools
          key: android-sdk-${{ env.NDK_VERSION }}-36-35.0.0

      - name: Install Android NDK and build-tools
        run: |
          sdkmanager --install "ndk;${NDK_VERSION}" "platforms;android-36" "build-tools;35.0.0"
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
          echo "NDK_HOME=${ANDROID_HOME}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm ci

      - name: Setup Android signing
        env:
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_BASE64: ${{ secrets.ANDROID_KEY_BASE64 }}
        run: |
          cd src-tauri/gen/android
          if [ -n "${ANDROID_KEY_BASE64:-}" ] && [ -n "${ANDROID_KEY_ALIAS:-}" ] && [ -n "${ANDROID_KEY_PASSWORD:-}" ]; then
            echo "Using release keystore from GitHub secrets"
            echo "keyAlias=$ANDROID_KEY_ALIAS" > keystore.properties
            echo "password=$ANDROID_KEY_PASSWORD" >> keystore.properties
            echo "$ANDROID_KEY_BASE64" | base64 -d > "$RUNNER_TEMP/branchline-release.jks"
            echo "storeFile=$RUNNER_TEMP/branchline-release.jks" >> keystore.properties
          else
            echo "No signing secrets set — generating a CI keystore for this build"
            keytool -genkeypair -v \
              -keystore "$RUNNER_TEMP/branchline-ci.jks" \
              -alias branchline \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass branchline -keypass branchline \
              -dname "CN=Branchline, OU=CI, O=Branchline, L=Internet, ST=NA, C=US"
            echo "keyAlias=branchline" > keystore.properties
            echo "password=branchline" >> keystore.properties
            echo "storeFile=$RUNNER_TEMP/branchline-ci.jks" >> keystore.properties
          fi

      - name: Build Android APK
        run: npm run tauri -- android build --apk --target aarch64
        env:
          NDK_HOME: ${{ env.NDK_HOME }}
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_HOME }}

      - name: Collect APK
        id: apk
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          APK=$(find src-tauri/gen/android -name '*.apk' -type f | head -n 1)
          if [ -z "$APK" ]; then
            echo "No APK found under src-tauri/gen/android"
            find src-tauri/gen/android -type f \( -name '*.apk' -o -name '*.aab' \) | head -50 || true
            exit 1
          fi
          OUT="Branchline-${VERSION}-android.apk"
          cp "$APK" "$OUT"
          cp "$APK" Branchline-android.apk
          echo "path=$OUT" >> "$GITHUB_OUTPUT"
          echo "stable=Branchline-android.apk" >> "$GITHUB_OUTPUT"
          ls -lh "$OUT" Branchline-android.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Branchline-${{ steps.version.outputs.version }}-android
          path: |
            ${{ steps.apk.outputs.path }}
            ${{ steps.apk.outputs.stable }}
          if-no-files-found: error

      - name: Upload APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release upload "${{ github.ref_name }}" \
            "${{ steps.apk.outputs.path }}" \
            "${{ steps.apk.outputs.stable }}" \
            -R "${{ github.repository }}" \
            --clobber

  stabilize-names:
    name: Stable download names
    needs: [publish-tauri]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Publish stable download filenames
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ github.ref_name }}"
          mkdir -p /tmp/rel
          gh release download "$TAG" -R "${{ github.repository }}" -D /tmp/rel

          copy_stable() {
            local pattern="$1"
            local stable="$2"
            local src
            src=$(find /tmp/rel -maxdepth 1 -type f -iname "$pattern" ! -name "$stable" | head -n 1 || true)
            if [ -z "$src" ]; then
              if [ -f "/tmp/rel/$stable" ]; then
                echo "Stable already: $stable"
              else
                echo "Skip missing pattern: $pattern"
              fi
              return 0
            fi
            cp "$src" "/tmp/rel/$stable"
            echo "Stable: $stable <- $(basename "$src")"
          }

          copy_stable '*aarch64*.dmg' 'Branchline-mac-arm64.dmg'
          copy_stable '*x64*.dmg' 'Branchline-mac-x64.dmg'
          copy_stable '*-setup.exe' 'Branchline-windows-setup.exe'
          copy_stable '*.AppImage' 'Branchline-linux.AppImage'
          copy_stable '*.deb' 'Branchline-linux.deb'

          REQUIRED=(
            Branchline-mac-arm64.dmg
            Branchline-mac-x64.dmg
            Branchline-windows-setup.exe
            Branchline-linux.AppImage
            Branchline-linux.deb
          )
          EXISTING=()
          missing=0
          for name in "${REQUIRED[@]}"; do
            f="/tmp/rel/$name"
            if [ -f "$f" ]; then
              EXISTING+=("$f")
            else
              echo "::error::Missing stable download name: $name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
          gh release upload "$TAG" "${EXISTING[@]}" -R "${{ github.repository }}" --clobber
